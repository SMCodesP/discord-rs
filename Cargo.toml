[package]
name = "discord-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
regex = "1.11"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.13.5", features = ["json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
dirs = "7.0.0"
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

[profile.dev]
debug = 1

